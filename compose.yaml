services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finance_demo
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: finance_demo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finance_demo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_demo -d finance_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finance_demo_data:
